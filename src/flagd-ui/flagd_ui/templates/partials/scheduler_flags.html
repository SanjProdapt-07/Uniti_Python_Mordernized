<div id="scheduler-flags" class="rounded-md bg-gray-800 p-6 text-gray-300 shadow-md">
  <div class="mb-4 flex items-center justify-between">
    <p class="text-lg font-semibold">Flags</p>
    <div class="flex gap-2">
      <button
        type="button"
        class="rounded bg-gray-700 px-3 py-2 text-xs font-medium text-gray-200 transition-colors duration-200 hover:bg-gray-600"
        ws-send
        hx-trigger="click"
        hx-vals='{"__event": "select_all"}'
      >
        All
      </button>
      <button
        type="button"
        class="rounded bg-gray-700 px-3 py-2 text-xs font-medium text-gray-200 transition-colors duration-200 hover:bg-gray-600"
        ws-send
        hx-trigger="click"
        hx-vals='{"__event": "select_none"}'
      >
        None
      </button>
    </div>
  </div>

  {%- if not available %}
  <p class="text-sm text-warning">
    No schedulable flags found in the current configuration.
  </p>
  {%- endif %}

  <div class="max-h-[70vh] overflow-y-auto">
    {%- for name, variants in available %}
    <div class="border-b border-gray-700 py-2 last:border-b-0">
      {%- if variants|length == 1 %}
      <label class="flex items-center gap-3 text-sm">
        <input type="checkbox" name="variants[{{ name }}][]" value="{{ variants[0] }}"{% if is_selected(form, name, variants[0]) %} checked{% endif %} />
        <span class="font-medium">{{ name }}</span>
      </label>
      {%- else %}
      <div class="mb-1 flex items-center justify-between">
        <span class="text-sm font-medium">{{ name }}</span>
        <button
          type="button"
          class="text-xs text-blue-400 hover:text-blue-300"
          data-flag="{{ name }}"
          ws-send
          hx-trigger="click"
          hx-vals='{{ {"__event": "toggle_flag", "flag": name}|tojson }}'
        >
          toggle all
        </button>
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 pl-1">
        {%- for variant in variants %}
        <label class="flex items-center gap-2 text-xs">
          <input type="checkbox" name="variants[{{ name }}][]" value="{{ variant }}"{% if is_selected(form, name, variant) %} checked{% endif %} />
          <span class="text-gray-300">{{ variant }}</span>
        </label>
        {%- endfor %}
      </div>
      {%- endif %}
    </div>
    {%- endfor %}
  </div>
</div>
