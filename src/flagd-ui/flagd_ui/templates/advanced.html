{% extends "root.html" %}
{% block content %}
<div class="relative min-h-screen">
  {% include "partials/navbar.html" %}

  {% include "partials/flashes.html" %}

  <div class="container mx-auto px-4 py-8">
    <form onsubmit="return false">
      {% include "partials/editor.html" %}
      <div>
        <button
          type="button"
          class="rounded bg-blue-500 px-8 py-4 font-medium text-white transition-colors duration-200 hover:bg-blue-600"
          ws-send
          hx-trigger="click"
          hx-vals='{"__event": "save"}'
        >
          Save
        </button>
        {% include "partials/unsaved.html" %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
