<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="root-path" content="{{ root_path }}" />
    <title>Flagd-ui</title>
    <link rel="stylesheet" href="{{ static_path('/assets/css/app.css') }}" />
    <script defer type="text/javascript" src="{{ static_path('/assets/vendor/htmx.min.js') }}"></script>
    <script defer type="text/javascript" src="{{ static_path('/assets/vendor/ws.js') }}"></script>
    <script defer type="text/javascript" src="{{ static_path('/assets/vendor/topbar.js') }}"></script>
    <script defer type="text/javascript" src="{{ static_path('/assets/js/app.js') }}"></script>
    <script>
      (() => {
        const setTheme = (theme) => {
          if (theme === "system") {
            localStorage.removeItem("phx:theme");
            document.documentElement.removeAttribute("data-theme");
          } else {
            localStorage.setItem("phx:theme", theme);
            document.documentElement.setAttribute("data-theme", theme);
          }
        };
        setTheme(localStorage.getItem("phx:theme") || "system");
        window.addEventListener("storage", (e) => e.key === "phx:theme" && setTheme(e.newValue || "system"));
        window.addEventListener("phx:set-theme", ({ detail: { theme } }) => setTheme(theme));
      })();
    </script>
  </head>
  <body>
    <div
      id="live-root"
      class="contents"
      data-view="{{ view_name }}"
      hx-ext="ws"
      ws-connect="{{ root_path }}/live?view={{ view_name }}&_csrf_token={{ csrf_token }}"
    >
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
