name: CodeQL analysis

on:
  workflow_call:
  schedule:
    - cron: "44 3 * * 4"  # every Thursday at 03:44 UTC
  workflow_dispatch:

permissions:
  contents: read  # required to checkout the repository

concurrency:
  group: codeql-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read  # required to scan GitHub Actions workflows
      contents: read  # required to checkout the repository
      security-events: write  # required to upload CodeQL SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
